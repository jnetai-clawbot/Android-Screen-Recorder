name: Build Screen Recorder APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.0)'
        required: false
        default: '1.6.0'
      version_code:
        description: 'Version code (integer)'
        required: false
        default: '160'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_PRESENT: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            cmdline-tools;latest

      - name: Update version (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.event.inputs.version_code }}/" app/build.gradle
          sed -i "s/versionName '[^']*'/versionName '${{ github.event.inputs.version_name }}'/" app/build.gradle

      - name: Determine app version
        id: ver
        run: |
          VERSION=$(grep -oP "versionName '\K[^']+" app/build.gradle | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Grant Gradle permissions
        run: chmod +x gradlew

      - name: Decode keystore for signing
        id: decode_keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ci-keystore.jks
            echo "keystore_ready=true" >> $GITHUB_OUTPUT
          else
            echo "keystore_ready=false" >> $GITHUB_OUTPUT
          fi

      - name: Build signed Debug APK
        if: steps.decode_keystore.outputs.keystore_ready == 'true'
        run: |
          ./gradlew assembleDebug \
            -PkeystorePath=$(pwd)/ci-keystore.jks \
            -PstorePassword="${{ secrets.KEYSTORE_PASSWORD }}" \
            -PkeyAlias="${{ secrets.KEY_ALIAS }}"

      - name: Build Debug APK (unsigned fallback)
        if: steps.decode_keystore.outputs.keystore_ready != 'true'
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Screen-Recorder.apk

      - name: Verify APK uses the stable release key
        if: env.KEYSTORE_PRESENT == 'true'
        run: |
          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/Screen-Recorder.apk | tee /tmp/certs.txt
          # Fingerprint of the long-lived keystore used by the public releases.
          grep -q "0e242579099a0f98dbe24059188496f6966e3931f3fbfcf2cf0d1d58c3f29bdb" /tmp/certs.txt \
            || { echo "ERROR: APK is not signed with the stable release keystore"; exit 1; }

      - name: Require signing key for tagged releases
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "$KEYSTORE_PRESENT" != "true" ]; then
            echo "ERROR: refusing to publish a tag without the release keystore secret"
            exit 1
          fi

      - name: Upload Screen-Recorder.apk
        uses: actions/upload-artifact@v4
        with:
          name: Screen-Recorder-v${{ steps.ver.outputs.version }}
          path: app/build/outputs/apk/debug/Screen-Recorder.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          overwrite_files: true
          files: |
            app/build/outputs/apk/debug/Screen-Recorder.apk
          body: |
            ## J~Net Screen Recorder v${{ steps.ver.outputs.version }}

            Record your screen with audio, and capture screenshots — with a floating quick-access bubble.

            ### What's new in 1.6.0
            - ▶️ **Start / Stop toggle on the main screen** (under the title)
            - 📸 **Screenshot button with a custom delay** so you can switch to the app first
            - ⏱ **Custom start-recording delay** (default 0 seconds)
            - 💾 **Import / Export settings** as a JSON backup file
            - 🫧 **Bubble overlay fix** — draws the real draggable bubble whenever "Display over other apps" is granted (Android 11+ no longer silently falls back to the system Bubbles API)
            - 🔐 APKs are signed with the same long-lived keystore, so updates install over older versions

            ### ✅ Compatible with:
            - Samsung Galaxy S series, Note series, A series
            - Google Pixel 6, 7, 8, 9
            - All Android 8.0+ (API 26+)

            ### Features
            - 🎥 Record screen + audio (MP4, H.264 + AAC)
            - 🫧 Floating quick-access bubble (drag to move, tap to expand)
            - 🎬 Record / Stop / Screenshot / Settings buttons in the bubble
            - ⏱ Start delay + screenshot delay
            - 📁 Saves to DCIM/ScreenRecorder/Recordings & Screenshots
            - ⚙️ Settings: save location, resolution, FPS, audio, bubble style
            - 💾 JSON import / export for all settings
            - ℹ️ About: made by jnetai.com, check for update, share app

            [🔗 jnetai.com](https://jnetai.com)
          generate_release_notes: false
