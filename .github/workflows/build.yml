name: Build Screen Recorder APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.0)'
        required: false
        default: '1.5.8'
      version_code:
        description: 'Version code (integer)'
        required: false
        default: '158'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            cmdline-tools;latest

      - name: Update version (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.event.inputs.version_code }}/" app/build.gradle
          sed -i "s/versionName '[^']*'/versionName '${{ github.event.inputs.version_name }}'/" app/build.gradle

      - name: Grant Gradle permissions
        run: chmod +x gradlew

      - name: Decode keystore for signing
        id: decode_keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ci-keystore.jks
            echo "keystore_ready=true" >> $GITHUB_OUTPUT
          else
            echo "keystore_ready=false" >> $GITHUB_OUTPUT
          fi

      - name: Build signed Debug APK
        if: steps.decode_keystore.outputs.keystore_ready == 'true'
        run: |
          ./gradlew assembleDebug \
            -PkeystorePath=$(pwd)/ci-keystore.jks \
            -PstorePassword="${{ secrets.KEYSTORE_PASSWORD }}" \
            -PkeyAlias="${{ secrets.KEY_ALIAS }}"

      - name: Build Debug APK (unsigned fallback)
        if: steps.decode_keystore.outputs.keystore_ready != 'true'
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Screen-Recorder.apk

      - name: Upload Screen-Recorder.apk
        uses: actions/upload-artifact@v4
        with:
          name: Screen-Recorder-v${{ github.event.inputs.version_name || '1.0.0' }}
          path: app/build/outputs/apk/debug/Screen-Recorder.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          overwrite_files: true
          files: |
            app/build/outputs/apk/debug/Screen-Recorder.apk
          body: |
            ## J~Net Screen Recorder v${{ github.event.inputs.version_name || '1.0.0' }}

            Record your screen with audio, and capture screenshots — with a floating quick-access bubble.

            ### ✅ Compatible with:
            - Samsung Galaxy S series, Note series, A series
            - Google Pixel 6, 7, 8, 9
            - All Android 7.0+ (API 24+)

            ### Features
            - 🎥 Record screen + audio (MP4, H.264 + AAC)
            - 🫧 Floating quick-access bubble (drag to move, tap to expand)
            - 🎬 Record / Stop / Screenshot / Settings buttons in the bubble
            - 📸 Screenshot capture (toggle on/off in settings)
            - 📁 Saves to DCIM/ScreenRecorder/Recordings & Screenshots
            - ⚙️ Settings: save location, resolution, FPS, record-audio toggle
            - ℹ️ About: made by jnetai.com, check for update, share app

            [🔗 jnetai.com](https://jnetai.com)
          generate_release_notes: false
